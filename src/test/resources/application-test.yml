spring:
  datasource:
    url: jdbc:h2:mem:tickets;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    properties:
      hibernate:
        generate_statistics: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

app:
  admin:
    email: ""
    password: ""
  scheduling:
    enabled: false

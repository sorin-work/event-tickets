<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Event Tickets'">Event Tickets</title>
  <th:block th:if="${og}">
    <meta name="description" th:content="${og.description}">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${og.title}">
    <meta property="og:description" th:content="${og.description}">
    <meta property="og:url" th:content="${og.url}">
  </th:block>
  <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
  <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<header th:fragment="header" class="site-header">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="container">
    <a class="brand" th:href="@{/}">Event Tickets</a>
    <nav class="nav">
      <a th:href="@{/}">Events</a>
      <a th:href="@{/tickets/find}">Find my tickets</a>
    </nav>
  </div>
</header>

<footer th:fragment="footer" class="site-footer">
  <div class="container">
    Event Tickets · tickets for small venues and meetups ·
    <a th:href="@{/events/past}">past events</a>
  </div>
</footer>

</body>
</html>

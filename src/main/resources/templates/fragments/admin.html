<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<body>
<header th:fragment="header(section)" class="site-header">
  <div class="container">
    <a class="brand" th:href="@{/admin}">Event Tickets · Admin</a>
    <nav class="nav">
      <a th:href="@{/admin}" th:classappend="${section == 'dashboard'} ? 'active'">Dashboard</a>
      <a th:href="@{/admin/events}" th:classappend="${section == 'events'} ? 'active'">Events</a>
      <a th:href="@{/admin/outbox}" th:classappend="${section == 'outbox'} ? 'active'">Outbox</a>
      <a th:href="@{/admin/users}" th:classappend="${section == 'users'} ? 'active'">Admins</a>
      <a th:href="@{/}" target="_blank">Public site</a>
      <form th:action="@{/admin/logout}" method="post" style="display:inline">
        <a th:href="@{/admin/account}" th:classappend="${section == 'account'} ? 'active'" sec:authentication="name">admin</a>
        <button class="btn" type="submit">Sign out</button>
      </form>
    </nav>
  </div>
</header>

<div th:fragment="flash">
  <div th:if="${flash}" class="alert alert-ok" th:text="${flash}">Saved.</div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}">Something went wrong.</div>
</div>

<span th:fragment="orderStatus(status)" class="badge"
      th:classappend="${status.name() == 'PAID'} ? 'badge-ok' : (${status.name() == 'CANCELLED'} ? 'badge-danger' : 'badge-warn')"
      th:text="${#strings.capitalize(#strings.toLowerCase(status.name()))}">Paid</span>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Upcoming events')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <h1>Upcoming events</h1>
  <form th:if="${hasEvents}" class="search" method="get" th:action="@{/}">
    <input type="search" name="q" th:value="${q}" placeholder="Search events or venues" aria-label="Search events">
    <button class="btn" type="submit">Search</button>
  </form>
  <div th:unless="${hasEvents}" class="card empty">No events on sale yet. Check back soon.</div>
  <div th:if="${hasEvents and #lists.isEmpty(events)}" class="card empty">
    No upcoming events match <strong th:text="${q}">query</strong>. <a th:href="@{/}">Show all</a>
  </div>
  <div class="event-list">
    <a class="card event-card" th:each="event : ${events}" th:href="@{/events/{slug}(slug=${event.slug})}">
      <div class="event-date" th:text="${@fmt.when(event)}">Fri 14 Mar 2030, 19:30</div>
      <h2 th:text="${event.title}">Summer Jazz Night</h2>
      <div class="muted" th:text="${event.venueName}">The Attic</div>
      <span th:if="${left[event.id] == 0}" class="badge badge-danger">Sold out</span>
      <span th:if="${left[event.id] > 0 and left[event.id] <= 10}" class="badge badge-warn"
            th:text="'Only ' + ${left[event.id]} + ' left'">Only 3 left</span>
    </a>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

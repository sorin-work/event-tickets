<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Find my tickets')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container narrow">
  <h1>Find my tickets</h1>
  <div th:if="${sent}" class="alert alert-ok">
    If we have tickets for upcoming events under that address, we have emailed you the links.
  </div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>
  <form th:unless="${sent}" class="card" method="post" th:action="@{/tickets/find}">
    <p class="muted">Lost the email with your tickets? We will send the links again.</p>
    <div class="field">
      <label for="email">Email used for the order</label>
      <input id="email" name="email" type="email" required maxlength="255" autocomplete="email">
    </div>
    <button class="btn btn-primary" type="submit">Email me my tickets</button>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Checkout')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
  <p><a th:href="@{/events/{slug}(slug=${event.slug})}" th:text="'&larr; ' + ${event.title}">&larr; Event</a></p>
  <h1>Checkout</h1>
  <div th:unless="${holdActive}" class="alert alert-warn">
    Your reservation has expired. <a th:href="@{/events/{slug}(slug=${event.slug})}">Choose tickets again</a>.
  </div>
  <section class="card">
    <h2 th:text="${event.title}">Event</h2>
    <p class="muted" th:text="${@fmt.when(event)}">date</p>
    <table>
      <tr th:each="item : ${order.items}">
        <td th:text="${item.quantity} + ' × ' + ${item.tier.name}">2 × Standing</td>
        <td class="num" th:text="${@fmt.money(item.lineTotalCents(), event.currency)}">€30.00</td>
      </tr>
      <tr>
        <th>Total</th>
        <th class="num" th:text="${@fmt.money(order.totalCents, event.currency)}">€30.00</th>
      </tr>
    </table>
  </section>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>
  <form th:if="${holdActive}" class="card" method="post" th:action="@{/checkout/{t}(t=${order.accessToken})}" th:object="${form}">
    <h2>Your details</h2>
    <p class="muted">
      Tickets are held for you until
      <strong th:text="${#temporals.format(order.holdExpiresAt.atZone(event.zone()), 'HH:mm')}">19:40</strong>.
    </p>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" th:field="*{name}" required maxlength="120" autocomplete="name">
      <div class="field-error" th:errors="*{name}"></div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" th:field="*{email}" required maxlength="255" autocomplete="email">
      <div class="field-error" th:errors="*{email}"></div>
    </div>
    <p class="muted">Payment is simulated in this demo: placing the order marks it as paid.</p>
    <button class="btn btn-primary" type="submit"
            th:text="${order.totalCents == 0} ? 'Get tickets' : 'Pay ' + ${@fmt.money(order.totalCents, event.currency)}">Pay</button>
  </form>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sales report')}"></head>
<body>
<header th:replace="~{fragments/admin :: header('events')}"></header>
<main class="container">
  <p><a th:href="@{/admin/events/{id}/edit(id=${event.id})}" th:text="'&larr; ' + ${event.title}">&larr; Event</a></p>
  <h1>Sales report</h1>
  <p class="muted" th:text="${event.title} + ' · ' + ${@fmt.when(event)}">Event</p>

  <div class="stats">
    <div class="card stat">
      <div class="stat-label">Tickets sold</div>
      <div class="stat-value" th:text="${report.ticketsSold} + ' / ' + ${report.capacity()}">40 / 100</div>
    </div>
    <div class="card stat">
      <div class="stat-label">Net revenue</div>
      <div class="stat-value" th:text="${@fmt.money(report.netCents, event.currency)}">€800.00</div>
    </div>
    <div class="card stat">
      <div class="stat-label">Orders</div>
      <div class="stat-value" th:text="${report.orders}">25</div>
    </div>
    <div class="card stat">
      <div class="stat-label">Checked in</div>
      <div class="stat-value" th:text="${report.checkedIn} + ' (' + ${report.percentCheckedIn()} + '%)'">0</div>
    </div>
  </div>

  <section class="card">
    <h2>By ticket tier</h2>
    <table>
      <thead><tr><th>Tier</th><th class="num">Price</th><th class="num">Sold</th><th class="num">Revenue</th></tr></thead>
      <tbody>
      <tr th:each="line : ${report.tiers}">
        <td th:text="${line.name}">Standing</td>
        <td class="num" th:text="${@fmt.price(line.priceCents, event.currency)}">€20.00</td>
        <td class="num">
          <span th:text="${line.sold} + ' / ' + ${line.capacity}">10 / 100</span>
          <div class="progress"><div class="progress-bar" th:style="'width:' + ${line.percentSold()} + '%'"></div></div>
        </td>
        <td class="num" th:text="${@fmt.money(line.grossCents, event.currency)}">€200.00</td>
      </tr>
      </tbody>
      <tfoot>
      <tr><td colspan="3">Gross</td><td class="num" th:text="${@fmt.money(report.grossCents, event.currency)}">€0.00</td></tr>
      <tr><td colspan="3">Promo discounts</td><td class="num" th:text="'-' + ${@fmt.money(report.discountCents, event.currency)}">€0.00</td></tr>
      <tr><th colspan="3">Net</th><th class="num" th:text="${@fmt.money(report.netCents, event.currency)}">€0.00</th></tr>
      </tfoot>
    </table>
    <p class="muted" th:if="${report.cancelledOrders > 0}"
       th:text="${report.cancelledOrders} + ' cancelled order(s) are not counted.'">1 cancelled</p>
  </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Events')}"></head>
<body>
<header th:replace="~{fragments/admin :: header('events')}"></header>
<main id="main" class="container">
  <div th:replace="~{fragments/admin :: flash}"></div>
  <h1>Events</h1>
  <nav class="filters">
    <a th:href="@{/admin/events}" th:classappend="${show == 'upcoming'} ? 'active'">Upcoming</a>
    <a th:href="@{/admin/events(show='past')}" th:classappend="${show == 'past'} ? 'active'">Past</a>
    <a th:href="@{/admin/events(show='all')}" th:classappend="${show == 'all'} ? 'active'">All</a>
  </nav>
  <p><a class="btn btn-primary" th:href="@{/admin/events/new}">New event</a></p>
  <div th:if="${#lists.isEmpty(events)}" class="card empty">No events yet. Create your first one.</div>
  <table th:unless="${#lists.isEmpty(events)}">
    <thead>
    <tr><th>Event</th><th>Starts</th><th>Venue</th><th class="num">Sold</th><th>Status</th></tr>
    </thead>
    <tbody>
    <tr th:each="event : ${events}">
      <td><a th:href="@{/admin/events/{id}/edit(id=${event.id})}" th:text="${event.title}">Title</a></td>
      <td th:text="${#temporals.format(event.startsAt, 'EEE d MMM yyyy, HH:mm')}">date</td>
      <td th:text="${event.venueName}">venue</td>
      <td class="num" th:text="${sold[event.id]} ?: 0">12</td>
      <td><span class="badge" th:classappend="${event.status.name() == 'PUBLISHED'} ? 'badge-ok' : (${event.status.name() == 'CANCELLED'} ? 'badge-danger' : '')" th:text="${#strings.capitalize(#strings.toLowerCase(event.status.name()))}">DRAFT</span></td>
    </tr>
    </tbody>
  </table>
</main>
<footer th:replace="~{fragments/admin :: footer}"></footer>
</body>
</html>

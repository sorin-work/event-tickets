<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${event} ? 'Edit event' : 'New event')}"></head>
<body>
<header th:replace="~{fragments/admin :: header('events')}"></header>
<main class="container">
  <div th:replace="~{fragments/admin :: flash}"></div>
  <p><a th:href="@{/admin/events}">&larr; All events</a></p>
  <h1 th:text="${event} ? ${event.title} : 'New event'">New event</h1>
  <div th:if="${event}" class="card status-bar">
    <span>Status: <span class="badge" th:text="${event.status}">DRAFT</span></span>
    <form th:if="${event.status.name() == 'DRAFT'}" method="post" th:action="@{/admin/events/{id}/publish(id=${event.id})}">
      <button class="btn btn-primary" type="submit">Publish</button>
    </form>
    <form th:if="${event.status.name() == 'PUBLISHED'}" method="post" th:action="@{/admin/events/{id}/unpublish(id=${event.id})}">
      <button class="btn" type="submit">Back to draft</button>
    </form>
    <form th:if="${event.status.name() != 'CANCELLED'}" method="post" th:action="@{/admin/events/{id}/cancel(id=${event.id})}"
          onsubmit="return confirm('Cancel this event? Ticket sales stop immediately.')">
      <button class="btn btn-danger" type="submit">Cancel event</button>
    </form>
  </div>
  <section th:if="${event}" class="card">
    <h2>Ticket tiers</h2>
    <div th:if="${#lists.isEmpty(tiers)}" class="empty">No ticket tiers yet. Add one before publishing.</div>
    <table th:unless="${#lists.isEmpty(tiers)}">
      <thead><tr><th>Tier</th><th class="num">Price</th><th class="num">Quantity</th><th>Sales window</th></tr></thead>
      <tbody>
      <tr th:each="tier : ${tiers}">
        <td><a th:href="@{/admin/events/{e}/tiers/{t}/edit(e=${event.id},t=${tier.id})}" th:text="${tier.name}">GA</a></td>
        <td class="num" th:text="${@fmt.price(tier.priceCents, event.currency)}">€10.00</td>
        <td class="num" th:text="${tier.quantity}">100</td>
        <td class="muted">
          <span th:text="${tier.salesStart} ? ${#temporals.format(tier.salesStart, 'd MMM HH:mm')} : 'now'">now</span>
          &ndash;
          <span th:text="${tier.salesEnd} ? ${#temporals.format(tier.salesEnd, 'd MMM HH:mm')} : 'event start'">start</span>
        </td>
      </tr>
      </tbody>
    </table>
    <p><a class="btn" th:href="@{/admin/events/{id}/tiers/new(id=${event.id})}">Add ticket tier</a></p>
  </section>
  <form class="card" method="post" th:object="${form}"
        th:action="${event} ? @{/admin/events/{id}(id=${event.id})} : @{/admin/events}">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" th:field="*{title}" required maxlength="160">
      <div class="field-error" th:errors="*{title}"></div>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" th:field="*{description}" maxlength="10000"></textarea>
      <div class="field-error" th:errors="*{description}"></div>
    </div>
    <div class="field">
      <label for="venueName">Venue</label>
      <input id="venueName" th:field="*{venueName}" required maxlength="160">
      <div class="field-error" th:errors="*{venueName}"></div>
    </div>
    <div class="field">
      <label for="venueAddress">Address</label>
      <input id="venueAddress" th:field="*{venueAddress}" maxlength="255">
    </div>
    <div class="field">
      <label for="startsAt">Starts</label>
      <input id="startsAt" type="datetime-local" th:field="*{startsAt}" required>
      <div class="field-error" th:errors="*{startsAt}"></div>
    </div>
    <div class="field">
      <label for="endsAt">Ends</label>
      <input id="endsAt" type="datetime-local" th:field="*{endsAt}">
      <div class="field-error" th:errors="*{endAfterStart}"></div>
    </div>
    <div class="field">
      <label for="timeZone">Time zone</label>
      <select id="timeZone" th:field="*{timeZone}">
        <option th:each="zone : ${timeZones}" th:value="${zone}" th:text="${zone}">Europe/Bucharest</option>
      </select>
      <div class="field-error" th:errors="*{timeZoneValid}"></div>
    </div>
    <div class="field">
      <label for="currency">Currency</label>
      <input id="currency" th:field="*{currency}" maxlength="3" required>
      <div class="field-error" th:errors="*{currency}"></div>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</main>
</body>
</html>

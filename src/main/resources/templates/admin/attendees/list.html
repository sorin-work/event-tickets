<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Attendees')}"></head>
<body>
<header th:replace="~{fragments/admin :: header('events')}"></header>
<main class="container">
  <p><a th:href="@{/admin/events/{id}/edit(id=${event.id})}" th:text="'&larr; ' + ${event.title}">&larr; Event</a></p>
  <h1>Attendees</h1>
  <form class="search" method="get">
    <input type="search" name="q" th:value="${q}" placeholder="Name, email, ticket code or order" aria-label="Search attendees">
    <button class="btn" type="submit">Search</button>
    <input type="hidden" name="arrival" th:value="${arrival}">
    <a class="btn" th:href="@{/admin/events/{id}/attendees.csv(id=${event.id})}">Export CSV</a>
  </form>
  <nav class="filters">
    <a th:href="@{''(q=${q})}" th:classappend="${arrival.name() == 'ALL'} ? 'active'">Everyone</a>
    <a th:href="@{''(q=${q},arrival='IN')}" th:classappend="${arrival.name() == 'IN'} ? 'active'">Checked in</a>
    <a th:href="@{''(q=${q},arrival='OUT')}" th:classappend="${arrival.name() == 'OUT'} ? 'active'">Not arrived</a>
  </nav>
  <div th:if="${attendees.isEmpty() and #strings.isEmpty(q)}" class="card empty">No tickets sold yet.</div>
  <div th:if="${attendees.isEmpty() and !#strings.isEmpty(q)}" class="card empty">
    Nobody matches <strong th:text="${q}">query</strong>.
  </div>
  <th:block th:unless="${attendees.isEmpty()}">
    <p class="muted" th:text="'Showing ' + ${attendees.firstItem()} + '–' + ${attendees.lastItem()} + ' of ' + ${attendees.total}">Showing 1–25 of 80</p>
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Tier</th><th>Ticket</th><th>Order</th><th>Checked in</th></tr></thead>
      <tbody>
      <tr th:each="ticket : ${attendees.items}">
        <td th:text="${ticket.attendeeName}">Ana Pop</td>
        <td th:text="${ticket.attendeeEmail}">ana@example.com</td>
        <td th:text="${ticket.tier.name}">Standing</td>
        <td><code th:text="${ticket.code}">ABCD</code></td>
        <td><a th:href="@{/admin/orders/{id}(id=${ticket.order.id})}" th:text="${ticket.order.reference}">ET-1</a></td>
        <td th:text="${ticket.checkedIn} ? ${@fmt.instant(ticket.checkedInAt, event)} : '—'">—</td>
      </tr>
      </tbody>
    </table>
    <nav th:replace="~{fragments/admin :: pager(${attendees}, ${'&q=' + #uris.escapeQueryParam(q) + '&arrival=' + arrival})}"></nav>
  </th:block>
</main>
</body>
</html>

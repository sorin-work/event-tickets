<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<header th:replace="~{fragments/admin :: header('events')}"></header>
<main class="container">
  <div th:replace="~{fragments/admin :: flash}"></div>
  <p><a th:href="@{/admin/events/{id}/edit(id=${event.id})}" th:text="'&larr; ' + ${event.title}">&larr; Event</a></p>
  <h1>Orders</h1>
  <div th:if="${#lists.isEmpty(orders)}" class="card empty">No orders yet.</div>
  <table th:unless="${#lists.isEmpty(orders)}">
    <thead>
    <tr><th>Order</th><th>Buyer</th><th>Placed</th><th class="num">Total</th><th>Status</th></tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
      <td><a th:href="@{/admin/orders/{id}(id=${order.id})}" th:text="${order.reference}">ET-ABC234</a></td>
      <td>
        <span th:text="${order.buyerName} ?: '—'">Ana Pop</span>
        <div class="muted" th:text="${order.buyerEmail}">ana@example.com</div>
      </td>
      <td th:text="${@fmt.instant(order.createdAt, event)}">date</td>
      <td class="num" th:text="${@fmt.money(order.totalCents, event.currency)}">€10.00</td>
      <td th:insert="~{fragments/admin :: orderStatus(${order.status})}"></td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Waitlist')}"></head>
<body>
<header th:replace="~{fragments/admin :: header('events')}"></header>
<main class="container">
  <div th:replace="~{fragments/admin :: flash}"></div>
  <p><a th:href="@{/admin/events/{id}/edit(id=${event.id})}" th:text="'&larr; ' + ${event.title}">&larr; Event</a></p>
  <h1>Waitlist</h1>
  <p class="muted">Released tickets are offered per tier in the order people joined.</p>
  <div th:if="${#lists.isEmpty(entries)}" class="card empty">Nobody is on the waitlist.</div>
  <table th:unless="${#lists.isEmpty(entries)}">
    <thead>
    <tr><th class="num">#</th><th>Name</th><th>Tier</th><th class="num">Tickets</th><th>Joined</th><th>Status</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${entries}">
      <td class="num" th:text="${positions[entry.id]} ?: ''">1</td>
      <td>
        <span th:text="${entry.name}">Ana</span>
        <div class="muted" th:text="${entry.email}">ana@example.com</div>
      </td>
      <td th:text="${entry.tier.name}">Floor</td>
      <td class="num" th:text="${entry.quantity}">2</td>
      <td th:text="${@fmt.instant(entry.createdAt, event)}">date</td>
      <td>
        <span class="badge" th:text="${#strings.capitalize(#strings.toLowerCase(entry.status.name()))}">Waiting</span>
        <div class="muted" th:if="${entry.status.name() == 'OFFERED'}"
             th:text="'until ' + ${@fmt.instant(entry.offerOrder.holdExpiresAt, event)}">until</div>
      </td>
      <td>
        <a th:if="${entry.offerOrder != null and entry.status.name() == 'CLAIMED'}"
           th:href="@{/admin/orders/{id}(id=${entry.offerOrder.id})}">order</a>
        <form th:if="${entry.status.name() == 'WAITING'}" method="post"
              th:action="@{/admin/events/{e}/waitlist/{w}/remove(e=${event.id},w=${entry.id})}"
              onsubmit="return confirm('Remove this person from the waitlist?')">
          <button class="btn-link" type="submit">remove</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</main>
</body>
</html>

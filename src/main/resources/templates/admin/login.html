<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
  <h1>Sign in</h1>
  <div th:if="${param.error}" class="alert alert-danger">Wrong email or password.</div>
  <div th:if="${param.logout}" class="alert alert-ok">You have been signed out.</div>
  <form class="card" th:action="@{/admin/login}" method="post">
    <div class="field">
      <label for="username">Email</label>
      <input id="username" name="username" type="email" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>

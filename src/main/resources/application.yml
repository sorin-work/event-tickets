spring:
  application:
    name: event-tickets
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tickets}
    username: ${DATABASE_USER:tickets}
    password: ${DATABASE_PASSWORD:tickets}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      # File names get a content hash (app-3f2a....css), so browsers can keep them for a year.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/favicon.svg
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-* from a reverse proxy so redirects and secure cookies use https.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        same-site: lax

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${BASE_URL:http://localhost:8080}
  # Creates sample events, orders and a waitlist in an empty database.
  seed-demo: ${SEED_DEMO:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  checkout:
    hold-duration: ${CHECKOUT_HOLD_DURATION:10m}
  waitlist:
    offer-duration: ${WAITLIST_OFFER_DURATION:24h}

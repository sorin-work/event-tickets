spring:
  application:
    name: event-tickets
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tickets}
    username: ${DATABASE_USER:tickets}
    password: ${DATABASE_PASSWORD:tickets}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${BASE_URL:http://localhost:8080}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  checkout:
    hold-duration: ${CHECKOUT_HOLD_DURATION:10m}
  waitlist:
    offer-duration: ${WAITLIST_OFFER_DURATION:24h}
